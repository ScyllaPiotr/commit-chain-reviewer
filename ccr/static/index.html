<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>ccr — Commit Chain Reviewer</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <link id="hl-light" rel="stylesheet" href="/static/vendor/github.min.css?v=0.1.0">
  <link id="hl-dark" rel="stylesheet" href="/static/vendor/github-dark.min.css?v=0.1.0">
  <script src="/static/theme.js"></script>
</head>
<body>
  <div id="app">
    <header id="topbar" role="banner">
      <button id="btn-sidebar" class="icon-btn" type="button" aria-label="Toggle sidebar" title="Toggle sidebar">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75ZM1.75 12h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1 0-1.5Z"/></svg>
      </button>
      <div id="repo-info" class="repo-info">
        <span class="repo-name" id="repo-name"></span>
        <span class="repo-branch" id="repo-branch"></span>
        <span class="range-spec" id="range-spec"></span>
        <span class="commit-count" id="commit-count"></span>
        <a id="pr-link" class="pr-link" target="_blank" rel="noopener noreferrer" hidden></a>
      </div>
      <div class="topbar-actions">
        <button id="btn-viewmode" class="tb-btn" type="button" aria-label="Toggle unified or split view" title="Toggle view mode">Unified</button>
        <button id="btn-wrap" class="tb-btn" type="button" aria-label="Toggle line wrapping" aria-pressed="true" title="Toggle wrap">Wrap</button>
        <button id="btn-ws" class="tb-btn" type="button" aria-label="Hide whitespace changes" aria-pressed="false" title="Hide whitespace changes">Hide ws</button>
        <button id="btn-theme" class="tb-btn" type="button" aria-label="Cycle theme" title="Theme: auto → light → dark">Auto</button>
        <button id="btn-reload" class="tb-btn icon-btn" type="button" aria-label="Reload the commit chain" title="Reload chain">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7.002 7.002 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7.002 7.002 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"/></svg>
        </button>
        <button id="btn-submit" class="tb-btn btn-submit" type="button" aria-label="Submit the pending comments as a review round" title="Nothing to submit — leave a comment first" disabled>
          <span class="label">Submit</span>
          <span class="badge badge-pending is-zero" title="Pending comments">0</span>
        </button>
        <button id="btn-copy-link" class="tb-btn icon-btn" type="button" aria-label="Copy a link to this view (includes the session token)" title="Copy link">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="m7.775 3.275 1.25-1.25a3.5 3.5 0 1 1 4.95 4.95l-2.5 2.5a3.5 3.5 0 0 1-4.95 0 .751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018 1.998 1.998 0 0 0 2.83 0l2.5-2.5a2.002 2.002 0 0 0-2.83-2.83l-1.25 1.25a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042Zm-4.69 9.64a1.998 1.998 0 0 0 2.83 0l1.25-1.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042l-1.25 1.25a3.5 3.5 0 1 1-4.95-4.95l2.5-2.5a3.5 3.5 0 0 1 4.95 0 .751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018 1.998 1.998 0 0 0-2.83 0l-2.5 2.5a1.998 1.998 0 0 0 0 2.83Z"/></svg>
        </button>
      </div>
    </header>
    <aside id="sidebar" aria-label="Commits and files">
      <section class="sidebar-section commits-section">
        <h2 class="sidebar-title">Commits</h2>
        <ol id="commit-list" class="commit-list" aria-label="Commit chain"></ol>
      </section>
      <section class="sidebar-section files-section">
        <div class="sidebar-title-row">
          <h2 class="sidebar-title">Files</h2>
          <span id="tree-count" class="tree-count"></span>
        </div>
        <div class="filter-row">
          <input id="file-filter" type="search" placeholder="Filter files…" aria-label="Filter files by path" autocomplete="off" spellcheck="false">
        </div>
        <div id="file-tree" class="file-tree" role="tree" aria-label="Changed files"></div>
      </section>
      <div id="sidebar-resizer" class="resizer resizer-v" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="-1"></div>
    </aside>
    <div id="content">
    <div id="banners" role="status" aria-live="polite">
      <div id="banner-disconnected" class="banner banner-warn" hidden><span class="banner-text">Disconnected — retrying…</span></div>
      <div id="banner-reloaded" class="banner banner-info" hidden>
        <span class="banner-text"></span>
        <button type="button" class="banner-close" aria-label="Dismiss">×</button>
      </div>
      <div id="banner-compare" class="banner banner-info" hidden>
        <span class="banner-text">Compare view — comments are disabled</span>
        <button type="button" class="link-btn btn-exit-compare">Exit compare</button>
      </div>
    </div>
    <main id="main" tabindex="-1">
      <div id="main-inner">
        <section id="commit-header" class="commit-header card" aria-label="Commit"></section>
        <div id="filter-status" class="filter-status" hidden></div>
        <div id="files" class="files" aria-label="Changed files"></div>
      </div>
    </main>
    </div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="tooltip" role="tooltip" hidden></div>
  <div id="notice-token" class="notice" hidden>
    <div class="notice-card">
      <h1>No valid session token for this tab</h1>
      <p>No valid session token for this tab — the server may have been restarted. Run <code>ccr status</code> (or <code>ccr open</code>) and open the printed URL.</p>
    </div>
  </div>
  <script src="/static/vendor/highlight.min.js?v=0.1.0"></script>
  <script src="/static/vendor/lang-cmake.min.js?v=0.1.0"></script>
  <script src="/static/vendor/lang-dockerfile.min.js?v=0.1.0"></script>
  <script src="/static/vendor/lang-erlang.min.js?v=0.1.0"></script>
  <script src="/static/vendor/lang-groovy.min.js?v=0.1.0"></script>
  <script src="/static/vendor/lang-haskell.min.js?v=0.1.0"></script>
  <script src="/static/vendor/lang-nix.min.js?v=0.1.0"></script>
  <script src="/static/vendor/lang-ocaml.min.js?v=0.1.0"></script>
  <script src="/static/vendor/lang-protobuf.min.js?v=0.1.0"></script>
  <script src="/static/vendor/lang-scala.min.js?v=0.1.0"></script>
  <script src="/static/app.js"></script>
</body>
</html>
